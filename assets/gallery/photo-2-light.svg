<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" fill="none">
  <defs>
    <linearGradient id="bgGrad2L" x1="0" y1="0" x2="1200" y2="750" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F1F5F9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" rx="20" fill="url(#bgGrad2L)" stroke="#CBD5E1" stroke-width="2"/>
  
  <!-- Window Header -->
  <rect x="30" y="30" width="1140" height="50" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
  <circle cx="60" cy="55" r="7" fill="#EF4444"/>
  <circle cx="85" cy="55" r="7" fill="#F59E0B"/>
  <circle cx="110" cy="55" r="7" fill="#10B981"/>
  <text x="145" y="60" fill="#0F172A" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600">Postman &amp; Swagger API Verification Architecture — SQA Contract Testing</text>

  <!-- Left Column: Swagger Specs & Schema -->
  <rect x="40" y="110" width="340" height="590" rx="16" fill="#FFFFFF" stroke="#0284C7" stroke-opacity="0.4"/>
  <rect x="60" y="130" width="140" height="28" rx="6" fill="#DBEAFE"/>
  <text x="130" y="149" fill="#1D4ED8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="middle">SWAGGER SPEC</text>
  <text x="60" y="190" fill="#0F172A" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Contract &amp; Schema</text>
  <text x="60" y="215" fill="#475569" font-family="system-ui, sans-serif" font-size="13">OpenAPI 3.0 Documentation validation</text>

  <rect x="60" y="240" width="300" height="70" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="80" y="265" fill="#0F172A" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">✓ Request Header Contracts</text>
  <text x="80" y="290" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="11">Authorization: Bearer &lt;JWT&gt;</text>

  <rect x="60" y="325" width="300" height="70" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="80" y="350" fill="#0F172A" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">✓ JSON Payload Validation</text>
  <text x="80" y="375" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="11">Types, Required Fields, Enums</text>

  <rect x="60" y="410" width="300" height="70" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="80" y="435" fill="#0F172A" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">✓ Pagination &amp; Limit Checks</text>
  <text x="80" y="460" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="11">page=1&amp;size=50 (Edge offsets)</text>

  <rect x="60" y="495" width="300" height="175" rx="10" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="80" y="525" fill="#0284C7" font-family="'JetBrains Mono', monospace" font-size="11"># Swagger to CSV Parser</text>
  <text x="80" y="550" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="11">endpoints = parse_swagger(doc)</text>
  <text x="80" y="575" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="11">for ep in endpoints:</text>
  <text x="100" y="600" fill="#15803D" font-family="'JetBrains Mono', monospace" font-size="11">assert_schema_match(ep)</text>
  <text x="80" y="635" fill="#059669" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">✓ 46 Modules Mapped</text>

  <!-- Middle Column: Postman Test Execution Flow -->
  <rect x="410" y="110" width="370" height="590" rx="16" fill="#FFFFFF" stroke="#10B981" stroke-opacity="0.4"/>
  <rect x="430" y="130" width="130" height="28" rx="6" fill="#DCFCE7"/>
  <text x="495" y="149" fill="#15803D" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="middle">POSTMAN SUITE</text>
  <text x="430" y="190" fill="#0F172A" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Dynamic Assertion Flow</text>
  <text x="430" y="215" fill="#475569" font-family="system-ui, sans-serif" font-size="13">Pre-request scripts &amp; Chai test scripts</text>

  <!-- Step 1 -->
  <circle cx="450" cy="265" r="14" fill="#0284C7"/>
  <text x="450" y="270" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">1</text>
  <text x="480" y="260" fill="#0F172A" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Auth Token Acquisition</text>
  <text x="480" y="280" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="11">pm.environment.set(&quot;jwt&quot;, res.token)</text>
  <line x1="450" y1="285" x2="450" y2="320" stroke="#94A3B8" stroke-dasharray="3 3"/>

  <!-- Step 2 -->
  <circle cx="450" cy="340" r="14" fill="#059669"/>
  <text x="450" y="345" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">2</text>
  <text x="480" y="335" fill="#0F172A" font-family="system-ui, sans-serif" font-size="14" font-weight="600">CRUD Transaction Execution</text>
  <text x="480" y="355" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="11">POST /orders -&gt; Response ID verified</text>
  <line x1="450" y1="360" x2="450" y2="395" stroke="#94A3B8" stroke-dasharray="3 3"/>

  <!-- Step 3 -->
  <circle cx="450" cy="415" r="14" fill="#D97706"/>
  <text x="450" y="420" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">3</text>
  <text x="480" y="410" fill="#0F172A" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Negative &amp; Edge Cases</text>
  <text x="480" y="430" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="11">400 Bad Request / 401 Unauthorized</text>
  <line x1="450" y1="435" x2="450" y2="470" stroke="#94A3B8" stroke-dasharray="3 3"/>

  <!-- Step 4 -->
  <circle cx="450" cy="490" r="14" fill="#7C3AED"/>
  <text x="450" y="495" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">4</text>
  <text x="480" y="485" fill="#0F172A" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Response Integrity Assertions</text>
  <text x="480" y="505" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="11">pm.response.to.have.status(200)</text>

  <rect x="430" y="540" width="330" height="130" rx="10" fill="#F8FAFC" stroke="#10B981" stroke-opacity="0.4"/>
  <text x="450" y="570" fill="#059669" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">✓ Test Results Summary</text>
  <text x="450" y="600" fill="#0F172A" font-family="'JetBrains Mono', monospace" font-size="12">Total Assertions: 480 passed</text>
  <text x="450" y="625" fill="#0F172A" font-family="'JetBrains Mono', monospace" font-size="12">Environment: Production Staging</text>
  <text x="450" y="650" fill="#059669" font-family="'JetBrains Mono', monospace" font-size="12">Pass Rate: 100% (Zero Blockers)</text>

  <!-- Right Column: API Contract Gates -->
  <rect x="810" y="110" width="350" height="590" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/>
  <rect x="830" y="130" width="130" height="28" rx="6" fill="#F1F5F9"/>
  <text x="895" y="149" fill="#334155" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="middle">QUALITY GATES</text>
  <text x="830" y="190" fill="#0F172A" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Release Criteria</text>
  <text x="830" y="215" fill="#475569" font-family="system-ui, sans-serif" font-size="13">Prerequisites for deployment</text>

  <rect x="830" y="240" width="310" height="85" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="850" y="265" fill="#059669" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">Gate 1: Security &amp; Auth</text>
  <text x="850" y="288" fill="#475569" font-family="system-ui, sans-serif" font-size="11">All routes require JWT. Zero unauthenticated leakages.</text>
  <text x="850" y="308" fill="#15803D" font-family="'JetBrains Mono', monospace" font-size="11">Verified in Postman &amp; Pytest</text>

  <rect x="830" y="340" width="310" height="85" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="850" y="365" fill="#0284C7" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">Gate 2: Schema Match</text>
  <text x="850" y="388" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Responses exactly match OpenAPI specifications.</text>
  <text x="850" y="408" fill="#1D4ED8" font-family="'JetBrains Mono', monospace" font-size="11">100% Contract Compliance</text>

  <rect x="830" y="440" width="310" height="85" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="850" y="465" fill="#D97706" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">Gate 3: Boundary Testing</text>
  <text x="850" y="488" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Max length, negative inputs, null values handled.</text>
  <text x="850" y="508" fill="#B45309" font-family="'JetBrains Mono', monospace" font-size="11">Graceful Error Responses</text>

  <rect x="830" y="540" width="310" height="130" rx="10" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="850" y="570" fill="#0F172A" font-family="system-ui, sans-serif" font-size="13" font-weight="700">QA Sign-Off Status</text>
  <text x="850" y="595" fill="#15803D" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">✓ Production Deployment Approved</text>
  <text x="850" y="620" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Signed by: Md Jaker Ullah Chowdhury Nahin</text>
  <text x="850" y="640" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Associate QA Engineer · Codezzi</text>
</svg>
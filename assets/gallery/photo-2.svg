<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" fill="none">
  <defs>
    <linearGradient id="bgP2_dark" x1="0" y1="0" x2="1200" y2="750" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080D1A"/>
      <stop offset="1" stop-color="#050811"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="750" rx="16" fill="url(#bgP2_dark)"/>
  <rect x="1" y="1" width="1198" height="748" rx="15" stroke="#1E2D4A" stroke-width="1.5"/>

  <!-- Top Header -->
  <rect x="1" y="1" width="1198" height="48" rx="15" fill="#0B1220"/>
  <line x1="1" y1="49" x2="1199" y2="49" stroke="#1E2D4A" stroke-width="1"/>
  <circle cx="28" cy="25" r="6" fill="#EF4444"/>
  <circle cx="48" cy="25" r="6" fill="#F59E0B"/>
  <circle cx="68" cy="25" r="6" fill="#10B981"/>
  <text x="95" y="30" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">Postman &amp; Swagger API Verification Architecture — SQA Contract Testing</text>
  <rect x="1035" y="14" width="140" height="24" rx="12" fill="rgba(56,189,248,0.15)" stroke="#38BDF8" stroke-width="1"/>
  <text x="1105" y="30" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">CONTRACT VERIFIED</text>

  <!-- 4 Step Pipeline Flow (Cleanly spaced, 260px cards, no overflow) -->
  <!-- Step 1 -->
  <rect x="40" y="75" width="260" height="260" rx="14" fill="#0E1726" stroke="#38BDF8" stroke-opacity="0.4"/>
  <circle cx="75" cy="110" r="18" fill="#38BDF8"/>
  <text x="75" y="116" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" text-anchor="middle">01</text>
  <text x="110" y="115" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">SPEC INGESTION</text>
  <text x="60" y="155" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Swagger &amp; OpenAPI</text>
  <text x="60" y="190" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">• OpenAPI 3.0 YAML/JSON</text>
  <text x="60" y="215" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">• Schema-to-CSV endpoint sync</text>
  <text x="60" y="240" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">• Request &amp; response blueprints</text>
  <rect x="60" y="280" width="220" height="34" rx="8" fill="#16233B"/>
  <text x="75" y="302" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">169 Endpoints Mapped</text>

  <!-- Step 2 -->
  <rect x="325" y="75" width="260" height="260" rx="14" fill="#0E1726" stroke="#F59E0B" stroke-opacity="0.4"/>
  <circle cx="360" cy="110" r="18" fill="#F59E0B"/>
  <text x="360" y="116" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" text-anchor="middle">02</text>
  <text x="395" y="115" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">TEST AUTHORING</text>
  <text x="345" y="155" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Postman Collections</text>
  <text x="345" y="190" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">• Dynamic env variables</text>
  <text x="345" y="215" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">• Pre-request JWT auth scripts</text>
  <text x="345" y="240" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">• Negative &amp; boundary tests</text>
  <rect x="345" y="280" width="220" height="34" rx="8" fill="#16233B"/>
  <text x="360" y="302" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">46 Module Collections</text>

  <!-- Step 3 -->
  <rect x="610" y="75" width="260" height="260" rx="14" fill="#0E1726" stroke="#818CF8" stroke-opacity="0.4"/>
  <circle cx="645" cy="110" r="18" fill="#818CF8"/>
  <text x="645" y="116" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" text-anchor="middle">03</text>
  <text x="680" y="115" fill="#818CF8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">AUTOMATION RUNNER</text>
  <text x="630" y="155" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Newman &amp; CLI</text>
  <text x="630" y="190" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">• Headless command runner</text>
  <text x="630" y="215" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">• HTML execution reports</text>
  <text x="630" y="240" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">• Status code &amp; SLA checks</text>
  <rect x="630" y="280" width="220" height="34" rx="8" fill="#16233B"/>
  <text x="645" y="302" fill="#818CF8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">CI Automated Runner</text>

  <!-- Step 4 -->
  <rect x="895" y="75" width="265" height="260" rx="14" fill="#0E1726" stroke="#10B981" stroke-opacity="0.4"/>
  <circle cx="930" cy="110" r="18" fill="#10B981"/>
  <text x="930" y="116" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" text-anchor="middle">04</text>
  <text x="965" y="115" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">HIGH-SPEED CI</text>
  <text x="915" y="155" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Pytest Transition</text>
  <text x="915" y="190" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">• Converted into Python scripts</text>
  <text x="915" y="215" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">• Single-session Requests client</text>
  <text x="915" y="240" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">• 1.48s complete regression run</text>
  <rect x="915" y="280" width="225" height="34" rx="8" fill="#16233B"/>
  <text x="930" y="302" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">100% Pass In CI Pipeline</text>

  <!-- Lower Section: Contract Scope & SQA Metrics (540px width cards, zero text overflow) -->
  <rect x="40" y="355" width="545" height="275" rx="14" fill="#0E1726" stroke="#1E2D4A"/>
  <text x="65" y="390" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Contract &amp; Schema Validation Protocol</text>
  <line x1="65" y1="405" x2="560" y2="405" stroke="#172338"/>

  <text x="65" y="435" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">1. JSON Schema Conformance</text>
  <text x="65" y="455" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">Validates data types, required keys, and array lengths via JSONSchema.</text>

  <text x="65" y="490" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">2. Response Status Matrix</text>
  <text x="65" y="510" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">Asserts standard 200, 201, 400, 401, 403, and 422 HTTP responses.</text>

  <text x="65" y="545" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">3. Latency &amp; Header SLAs</text>
  <text x="65" y="565" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">Validates Content-Type, CORS, and sub-300ms SLA per endpoint.</text>

  <rect x="615" y="355" width="545" height="275" rx="14" fill="#0E1726" stroke="#1E2D4A"/>
  <text x="640" y="390" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Business Impact &amp; Defect Prevention</text>
  <line x1="640" y1="405" x2="1135" y2="405" stroke="#172338"/>

  <text x="640" y="435" fill="#818CF8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">● 65% Cycle Time Reduction</text>
  <text x="640" y="455" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">Replaces manual Postman checks with automated CI regression test runs.</text>

  <text x="640" y="490" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">● Zero Contract Drifts</text>
  <text x="640" y="510" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">Catches backend model changes before they break frontend UI components.</text>

  <text x="640" y="545" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">● Single-Session Authorization</text>
  <text x="640" y="565" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">Authenticates once and reuses bearer token across all 169 endpoints.</text>

  <!-- Bottom Quote Bar (Cleanly wrapped on 2 lines, no single-line overflow) -->
  <rect x="40" y="650" width="1120" height="65" rx="10" fill="#16233B" stroke="#1E2D4A"/>
  <text x="65" y="680" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-style="italic">&quot;Automated repeatable checks cut manual release testing cycles by over 65% while catching critical contract drifts early.&quot;</text>
  <text x="65" y="700" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">— Md Jaker Ullah Chowdhury Nahin · Associate QA Engineer</text>
</svg>
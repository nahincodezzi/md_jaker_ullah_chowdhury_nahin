  <text x="660" y="408" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11">import pandas as pd</text>
  <text x="660" y="430" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11">import pytest</text>
  <text x="660" y="460" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="11">def test_mushak_bulk_ledger_reconciliation():</text>
  <text x="680" y="485" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="11">  df = generate_synthetic_invoices(n=10000)</text>
  <text x="680" y="510" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="11">  calculated_vat = (df['subtotal'] * 0.15).round(2)</text>
  <text x="680" y="535" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="11">  assert (df['vat_amount'] == calculated_vat).all()</text>
  <text x="680" y="560" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="11">  assert df['vds_deducted'].sum() == expected_vds</text>
  <text x="660" y="585" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">  # 10,000 invoices reconciled in 0.42 seconds</text>


  <text x="65" y="361" fill="#0F172A" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">REAL-WORLD BUG REPORT ARCHITECTURE (CODEZZI PRODUCTION SAMPLE)</text>

  <!-- Title Line -->
  <text x="65" y="405" fill="#0284C7" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">DEFECT: [SkyVAT] [Mushak 6.3] Rounding discrepancy on fractional line item quantities</text>
  
  <!-- Environment Context Bar -->
  <rect x="65" y="420" width="1070" height="32" rx="6" fill="#F1F5F9"/>
  <text x="80" y="441" fill="#334155" font-family="'JetBrains Mono', monospace" font-size="11">Staging Build v2.8.4  |  Chrome 129 / Firefox 131  |  Database: PostgreSQL 15  |  Module: VAT Register</text>

  <!-- Steps to Reproduce -->
  <text x="65" y="480" fill="#0F172A" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Steps to Reproduce:</text>
  <text x="65" y="505" fill="#334155" font-family="'JetBrains Mono', monospace" font-size="12">1. Open Sales Invoice &gt; New Order &gt; Add Raw Materials with quantity 12.375 units</text>
  <text x="65" y="528" fill="#334155" font-family="'JetBrains Mono', monospace" font-size="12">2. Apply 15% standard Mushak VAT rate and click 'Generate Tax Invoice'</text>
  <text x="65" y="551" fill="#334155" font-family="'JetBrains Mono', monospace" font-size="12">3. Compare PDF invoice tax value against Database sales_ledger table record</text>

  <!-- Actual Result Box (Rose Tinted, Wrapped) -->
  <rect x="65" y="575" width="1070" height="48" rx="8" fill="#FFE4E6" stroke="#E11D48" stroke-opacity="0.3"/>
  <text x="80" y="595" fill="#E11D48" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">ACTUAL RESULT:</text>
  <text x="195" y="595" fill="#0F172A" font-family="system-ui, sans-serif" font-size="12">UI display truncates decimal to 2 places before multiplication causing a 0.04 BDT tax ledger variance.</text>
  <text x="80" y="612" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">Root Cause: Frontend JS parseFloat().toFixed(2) called prematurely before passing to backend.</text>

  <!-- Expected Result Box (Emerald Tinted, Wrapped) -->
  <rect x="65" y="632" width="1070" height="48" rx="8" fill="#DCFCE7" stroke="#059669" stroke-opacity="0.3"/>
  <text x="80" y="652" fill="#15803D" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">EXPECTED RESULT:</text>
  <text x="205" y="652" fill="#0F172A" font-family="system-ui, sans-serif" font-size="12">System must preserve 4 decimal float precision until final total round-off per NBR regulatory guidelines.</text>
  <text x="80" y="669" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">Resolution: Backend handles exact arithmetic; automated pytest regression suite test_mushak_rounding added.</text>

  <!-- Footer Tag -->
  <text x="65" y="705" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="11">Logged by Md Jaker Ullah Chowdhury Nahin · Retested &amp; Certified in Sprint 18 Release</text>

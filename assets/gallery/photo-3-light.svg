<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" fill="none">
  <defs>
    <linearGradient id="bgGrad3L" x1="0" y1="0" x2="1200" y2="750" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F1F5F9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" rx="20" fill="url(#bgGrad3L)" stroke="#CBD5E1" stroke-width="2"/>
  
  <!-- Header -->
  <rect x="30" y="30" width="1140" height="50" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
  <circle cx="60" cy="55" r="7" fill="#EF4444"/>
  <circle cx="85" cy="55" r="7" fill="#F59E0B"/>
  <circle cx="110" cy="55" r="7" fill="#10B981"/>
  <text x="145" y="60" fill="#0F172A" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600">Bug Life Cycle &amp; Defect Resolution Protocol — SQA Standards</text>

  <!-- Flowchart Stages -->
  <!-- Stage 1: Discovery -->
  <rect x="50" y="120" width="230" height="240" rx="16" fill="#FFFFFF" stroke="#EF4444" stroke-opacity="0.4"/>
  <rect x="70" y="140" width="80" height="26" rx="6" fill="#FEE2E2"/>
  <text x="110" y="157" fill="#DC2626" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">STEP 01</text>
  <text x="70" y="195" fill="#0F172A" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Discovery &amp; Log</text>
  <text x="70" y="225" fill="#475569" font-family="system-ui, sans-serif" font-size="12">Detailed Steps to Reproduce</text>
  <text x="70" y="245" fill="#475569" font-family="system-ui, sans-serif" font-size="12">Expected vs Actual Result</text>
  <text x="70" y="265" fill="#475569" font-family="system-ui, sans-serif" font-size="12">Network Logs &amp; Screenshots</text>
  <rect x="70" y="295" width="190" height="40" rx="8" fill="#FEE2E2"/>
  <text x="85" y="320" fill="#DC2626" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Priority: High / Blocker</text>

  <!-- Arrow 1 -> 2 -->
  <path d="M290 240 L330 240" stroke="#64748B" stroke-width="2"/>
  <polygon points="330,240 322,235 322,245" fill="#64748B"/>

  <!-- Stage 2: Triage -->
  <rect x="340" y="120" width="230" height="240" rx="16" fill="#FFFFFF" stroke="#F59E0B" stroke-opacity="0.4"/>
  <rect x="360" y="140" width="80" height="26" rx="6" fill="#FEF3C7"/>
  <text x="400" y="157" fill="#D97706" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">STEP 02</text>
  <text x="360" y="195" fill="#0F172A" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Triage &amp; Assign</text>
  <text x="360" y="225" fill="#475569" font-family="system-ui, sans-serif" font-size="12">Root Cause Hypothesis</text>
  <text x="360" y="245" fill="#475569" font-family="system-ui, sans-serif" font-size="12">Module Classification</text>
  <text x="360" y="265" fill="#475569" font-family="system-ui, sans-serif" font-size="12">Developer Allocation</text>
  <rect x="360" y="295" width="190" height="40" rx="8" fill="#FEF3C7"/>
  <text x="375" y="320" fill="#D97706" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Status: In Progress</text>

  <!-- Arrow 2 -> 3 -->
  <path d="M580 240 L620 240" stroke="#64748B" stroke-width="2"/>
  <polygon points="620,240 612,235 612,245" fill="#64748B"/>

  <!-- Stage 3: Retest -->
  <rect x="630" y="120" width="230" height="240" rx="16" fill="#FFFFFF" stroke="#0284C7" stroke-opacity="0.4"/>
  <rect x="650" y="140" width="80" height="26" rx="6" fill="#DBEAFE"/>
  <text x="690" y="157" fill="#1D4ED8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">STEP 03</text>
  <text x="650" y="195" fill="#0F172A" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Verification Run</text>
  <text x="650" y="225" fill="#475569" font-family="system-ui, sans-serif" font-size="12">Build Deployed to QA</text>
  <text x="650" y="245" fill="#475569" font-family="system-ui, sans-serif" font-size="12">Re-execute Exact Steps</text>
  <text x="650" y="265" fill="#475569" font-family="system-ui, sans-serif" font-size="12">Check Side-effect Areas</text>
  <rect x="650" y="295" width="190" height="40" rx="8" fill="#DBEAFE"/>
  <text x="665" y="320" fill="#1D4ED8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Automated + Manual</text>

  <!-- Arrow 3 -> 4 -->
  <path d="M870 240 L910 240" stroke="#64748B" stroke-width="2"/>
  <polygon points="910,240 902,235 902,245" fill="#64748B"/>

  <!-- Stage 4: Close -->
  <rect x="920" y="120" width="230" height="240" rx="16" fill="#FFFFFF" stroke="#10B981" stroke-opacity="0.4"/>
  <rect x="940" y="140" width="80" height="26" rx="6" fill="#DCFCE7"/>
  <text x="980" y="157" fill="#15803D" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">STEP 04</text>
  <text x="940" y="195" fill="#0F172A" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Closure &amp; Certified</text>
  <text x="940" y="225" fill="#475569" font-family="system-ui, sans-serif" font-size="12">Bug Marked Verified / Closed</text>
  <text x="940" y="245" fill="#475569" font-family="system-ui, sans-serif" font-size="12">Regression Suite Updated</text>
  <text x="940" y="265" fill="#475569" font-family="system-ui, sans-serif" font-size="12">Ready for Release Branch</text>
  <rect x="940" y="295" width="190" height="40" rx="8" fill="#DCFCE7"/>
  <text x="955" y="320" fill="#15803D" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">100% Retest Passed</text>

  <!-- Defect Triage Rules Table -->
  <rect x="50" y="390" width="1100" height="320" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/>
  <rect x="50" y="390" width="1100" height="45" rx="16" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="75" y="418" fill="#0F172A" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">REAL BUG REPORT TEMPLATE (STANDARDIZED QA SCHEMA)</text>
  <text x="980" y="418" fill="#059669" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">SEV: S1/BLOCKER</text>

  <rect x="70" y="455" width="1060" height="235" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="95" y="485" fill="#0F172A" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">Title: [SkyVAT] [Mushak 6.3] Real-time VAT calculation rounding off error on item level quantities</text>
  <text x="95" y="515" fill="#475569" font-family="system-ui, sans-serif" font-size="12">Environment: Staging Server v2.4.1 | Database: PostgreSQL 15 | Browser: Chrome 124.0 (x64)</text>
  <text x="95" y="545" fill="#1D4ED8" font-family="'JetBrains Mono', monospace" font-size="12">Preconditions: User logged in as &quot;Branch Admin&quot;, Company VAT registration number configured.</text>
  <text x="95" y="575" fill="#0F172A" font-family="system-ui, sans-serif" font-size="12">Steps to Reproduce: 1. Navigate to Sales -&gt; New Invoice. 2. Add product with fractional quantity (e.g. 2.75 units). 3. Apply 15% Standard VAT.</text>
  <text x="95" y="605" fill="#DC2626" font-family="system-ui, sans-serif" font-size="12">Actual Result: Total VAT computes to 41.24 BDT instead of mathematically reconciled 41.25 BDT due to float truncating.</text>
  <text x="95" y="635" fill="#15803D" font-family="system-ui, sans-serif" font-size="12">Expected Result: Decimal precision should follow NBR guidelines with 2-digit half-up rounding (41.25 BDT).</text>
  <text x="95" y="665" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="12">Evidence: Attached network HAR log, response payload JSON, and screenshot of Mushak register mismatch.</text>
</svg>
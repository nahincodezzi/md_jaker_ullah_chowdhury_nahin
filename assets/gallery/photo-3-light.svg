<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" fill="none">
  <defs>
    <linearGradient id="bgGrad3" x1="0" y1="0" x2="1200" y2="750" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF2F6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" rx="20" fill="url(#bgGrad3)" stroke="#CBD5E1" stroke-width="2"/>
  
  <!-- Header -->
  <rect x="30" y="30" width="1140" height="50" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <circle cx="60" cy="55" r="7" fill="#EF4444"/>
  <circle cx="85" cy="55" r="7" fill="#F59E0B"/>
  <circle cx="110" cy="55" r="7" fill="#10B981"/>
  <text x="145" y="60" fill="#1E293B" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600">Bug Life Cycle &amp; Defect Resolution Protocol — SQA Standards</text>

  <!-- Flowchart Stages -->
  <!-- Stage 1: Discovery -->
  <rect x="50" y="120" width="230" height="240" rx="16" fill="#FFFFFF" stroke="#EF4444" stroke-opacity="0.5"/>
  <rect x="70" y="140" width="80" height="26" rx="6" fill="#EF4444" fill-opacity="0.2"/>
  <text x="110" y="157" fill="#EF4444" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">STEP 01</text>
  <text x="70" y="195" fill="#0F172A" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Discovery &amp; Log</text>
  <text x="70" y="225" fill="#475569" font-family="system-ui, sans-serif" font-size="12">Detailed Steps to Reproduce</text>
  <text x="70" y="245" fill="#475569" font-family="system-ui, sans-serif" font-size="12">Expected vs Actual Result</text>
  <text x="70" y="265" fill="#475569" font-family="system-ui, sans-serif" font-size="12">Network Logs &amp; Screenshots</text>
  <rect x="70" y="295" width="190" height="40" rx="8" fill="#F1F5F9" stroke="#E2E8F0"/>
  <text x="85" y="320" fill="#F87171" font-family="'JetBrains Mono', monospace" font-size="11">Priority: High / Blocker</text>

  <!-- Arrow 1 -> 2 -->
  <path d="M290 240 L330 240" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <polygon points="330,240 322,235 322,245" fill="#94A3B8"/>

  <!-- Stage 2: Triage -->
  <rect x="340" y="120" width="230" height="240" rx="16" fill="#FFFFFF" stroke="#F59E0B" stroke-opacity="0.5"/>
  <rect x="360" y="140" width="80" height="26" rx="6" fill="#F59E0B" fill-opacity="0.2"/>
  <text x="400" y="157" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">STEP 02</text>
  <text x="360" y="195" fill="#0F172A" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Triage &amp; Assign</text>
  <text x="360" y="225" fill="#475569" font-family="system-ui, sans-serif" font-size="12">Root Cause Hypothesis</text>
  <text x="360" y="245" fill="#475569" font-family="system-ui, sans-serif" font-size="12">Module Classification</text>
  <text x="360" y="265" fill="#475569" font-family="system-ui, sans-serif" font-size="12">Developer Allocation</text>
  <rect x="360" y="295" width="190" height="40" rx="8" fill="#F1F5F9" stroke="#E2E8F0"/>
  <text x="375" y="320" fill="#D97706" font-family="'JetBrains Mono', monospace" font-size="11">Status: In Progress</text>

  <!-- Arrow 2 -> 3 -->
  <polygon points="620,240 612,235 612,245" fill="#94A3B8"/>
  <path d="M580 240 L620 240" stroke="#475569" stroke-width="2"/>

  <!-- Stage 3: Retest -->
  <rect x="630" y="120" width="230" height="240" rx="16" fill="#FFFFFF" stroke="#3B82F6" stroke-opacity="0.5"/>
  <rect x="650" y="140" width="80" height="26" rx="6" fill="#3B82F6" fill-opacity="0.2"/>
  <text x="690" y="157" fill="#3B82F6" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">STEP 03</text>
  <text x="650" y="195" fill="#0F172A" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Verification Run</text>
  <text x="650" y="225" fill="#475569" font-family="system-ui, sans-serif" font-size="12">Build Deployed to QA</text>
  <text x="650" y="245" fill="#475569" font-family="system-ui, sans-serif" font-size="12">Re-execute Exact Steps</text>
  <text x="650" y="265" fill="#475569" font-family="system-ui, sans-serif" font-size="12">Check Side-effect Areas</text>
  <rect x="650" y="295" width="190" height="40" rx="8" fill="#F1F5F9" stroke="#E2E8F0"/>
  <text x="665" y="320" fill="#2563EB" font-family="'JetBrains Mono', monospace" font-size="11">Automated + Manual</text>

  <!-- Arrow 3 -> 4 -->
  <polygon points="910,240 902,235 902,245" fill="#94A3B8"/>
  <path d="M870 240 L910 240" stroke="#475569" stroke-width="2"/>

  <!-- Stage 4: Closed / Sign-off -->
  <rect x="920" y="120" width="230" height="240" rx="16" fill="#FFFFFF" stroke="#10B981" stroke-opacity="0.5"/>
  <rect x="940" y="140" width="80" height="26" rx="6" fill="#10B981" fill-opacity="0.2"/>
  <text x="980" y="157" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">STEP 04</text>
  <text x="940" y="195" fill="#0F172A" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Closed &amp; Certified</text>
  <text x="940" y="225" fill="#475569" font-family="system-ui, sans-serif" font-size="12">Regression Regression Pass</text>
  <text x="940" y="245" fill="#475569" font-family="system-ui, sans-serif" font-size="12">Pytest Regression Added</text>
  <text x="940" y="265" fill="#475569" font-family="system-ui, sans-serif" font-size="12">Release Notes Updated</text>
  <rect x="940" y="295" width="190" height="40" rx="8" fill="#F1F5F9" stroke="#E2E8F0"/>
  <text x="955" y="320" fill="#059669" font-family="'JetBrains Mono', monospace" font-size="11">Status: VERIFIED CLOSED</text>

  <!-- Bottom Panel: Sample SQA Bug Report Template -->
  <rect x="50" y="390" width="1100" height="320" rx="16" fill="#0D131F" stroke="#1E293B"/>
  <rect x="50" y="390" width="1100" height="40" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="80" y="415" fill="#1E293B" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">REAL-WORLD BUG REPORT ARCHITECTURE (SAMPLE FROM CODEZZI CMS)</text>
  <rect x="980" y="397" width="140" height="25" rx="5" fill="#EF4444" fill-opacity="0.2"/>
  <text x="1050" y="414" fill="#F87171" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">DEFECT #QA-412</text>

  <text x="80" y="460" fill="#0284C7" font-family="'JetBrains Mono', monospace" font-size="13">TITLE: [SkyVAT] [VAT Register] Mushak 6.3 calculation rounding discrepancy on fractional quantity</text>
  
  <text x="80" y="495" fill="#475569" font-family="system-ui, sans-serif" font-size="13" font-weight="600">ENVIRONMENT:</text>
  <text x="210" y="495" fill="#1E293B" font-family="system-ui, sans-serif" font-size="13">Staging Build v2.8.4 | Chrome 129 &amp; Firefox 131 | Database PostgreSQL 15</text>

  <text x="80" y="525" fill="#475569" font-family="system-ui, sans-serif" font-size="13" font-weight="600">STEPS TO REPRODUCE:</text>
  <text x="80" y="550" fill="#334155" font-family="'JetBrains Mono', monospace" font-size="12">1. Navigate to Sales Invoice > New Order > Add Raw Materials with quantity 12.375 units</text>
  <text x="80" y="572" fill="#334155" font-family="'JetBrains Mono', monospace" font-size="12">2. Apply 15% standard Mushak VAT rate and click 'Generate Tax Invoice'</text>
  <text x="80" y="594" fill="#334155" font-family="'JetBrains Mono', monospace" font-size="12">3. Compare PDF invoice tax value against Database sales_ledger table record</text>

  <text x="80" y="635" fill="#F87171" font-family="'JetBrains Mono', monospace" font-size="12"><tspan font-weight="700">ACTUAL RESULT:</tspan> UI display truncates decimal to 2 places before multiplication causing 0.04 BDT tax variance.</text>
  <text x="80" y="660" fill="#059669" font-family="'JetBrains Mono', monospace" font-size="12"><tspan font-weight="700">EXPECTED RESULT:</tspan> System must preserve 4 decimal float precision until final total round-off as per NBR guidelines.</text>

  <rect x="80" y="685" width="450" height="1" fill="#334155"/>
  <text x="80" y="698" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Logged by Md Jaker Ullah Chowdhury Nahin · Retested &amp; Certified in Sprint 18 Release</text>
</svg>
  <text x="387" y="107" fill="#D97706" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">STAGE 02</text>
  <text x="345" y="145" fill="#0F172A" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Triage &amp; Assign</text>
  <text x="345" y="175" fill="#334155" font-family="system-ui, sans-serif" font-size="12">• Root cause hypothesis</text>
  <text x="345" y="200" fill="#334155" font-family="system-ui, sans-serif" font-size="12">• Module classification</text>
  <text x="345" y="225" fill="#334155" font-family="system-ui, sans-serif" font-size="12">• Dev branch assignment</text>

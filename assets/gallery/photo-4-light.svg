  <path d="M100 560 C 200 550, 300 480, 420 460 C 520 450, 600 440, 750 435 L 750 580 L 100 580 Z" fill="url(#curveGradL)"/>
  <path d="M100 560 C 200 550, 300 480, 420 460 C 520 450, 600 440, 750 435" stroke="#10B981" stroke-width="3"/>

  <!-- Graph Legend -->

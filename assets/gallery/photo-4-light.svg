  <line x1="100" y1="490" x2="760" y2="490" stroke="#E2E8F0" stroke-dasharray="4 4"/>
  <text x="60" y="495" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="11">100ms</text>
  <line x1="100" y1="580" x2="760" y2="580" stroke="#CBD5E1"/>
  <text x="60" y="585" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="11">0ms</text>


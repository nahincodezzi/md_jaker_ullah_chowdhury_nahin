  <text x="175" y="172" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="12">(SLA &lt; 300ms)</text>

  <rect x="325" y="105" width="260" height="90" rx="14" fill="#FFFFFF" stroke="#0284C7" stroke-opacity="0.4"/>
  <text x="350" y="135" fill="#475569" font-family="system-ui, sans-serif" font-size="12" font-weight="600">PEAK THROUGHPUT</text>
  <text x="350" y="175" fill="#0284C7" font-family="system-ui, sans-serif" font-size="32" font-weight="800">1,840</text>
  <text x="460" y="172" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="12">req / sec</text>

  <rect x="610" y="105" width="260" height="90" rx="14" fill="#FFFFFF" stroke="#6366F1" stroke-opacity="0.4"/>
  <text x="635" y="135" fill="#475569" font-family="system-ui, sans-serif" font-size="12" font-weight="600">P95 LATENCY</text>
  <text x="635" y="175" fill="#4F46E5" font-family="system-ui, sans-serif" font-size="32" font-weight="800">210 ms</text>
  <text x="735" y="172" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="12">Stable Under Peak</text>

  <rect x="895" y="105" width="265" height="90" rx="14" fill="#FFFFFF" stroke="#10B981" stroke-opacity="0.4"/>
  <text x="920" y="135" fill="#475569" font-family="system-ui, sans-serif" font-size="12" font-weight="600">HTTP ERROR RATE</text>
  <text x="920" y="175" fill="#059669" font-family="system-ui, sans-serif" font-size="32" font-weight="800">0.00 %</text>
  <text x="1035" y="172" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="12">0 Dropped Req</text>

  <!-- Load Curve Graph Section -->

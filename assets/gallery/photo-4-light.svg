  <text x="295" y="674" fill="#475569" font-family="system-ui, sans-serif" font-size="12">Response Time (ms)</text>
  <circle cx="450" cy="670" r="5" fill="#0284C7"/>
  <text x="465" y="674" fill="#475569" font-family="system-ui, sans-serif" font-size="12">Virtual Users (VUs)</text>

  <!-- Right Side Test Details -->
  <rect x="825" y="215" width="335" height="495" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="850" y="250" fill="#0F172A" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Test Execution Details</text>

  <rect x="850" y="280" width="285" height="110" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="865" y="305" fill="#0284C7" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">k6 Load Test Script</text>
  <text x="865" y="325" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="11">import http from 'k6/http';</text>
  <text x="865" y="345" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="11">export const options = {</text>
  <text x="880" y="365" fill="#15803D" font-family="'JetBrains Mono', monospace" font-size="11">vus: 500, duration: '5m'</text>
  <text x="865" y="380" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="11">};</text>

  <rect x="850" y="410" width="285" height="150" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="865" y="435" fill="#0F172A" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Critical Endpoints Tested</text>
  <text x="865" y="460" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="11">• POST /api/v1/sms/send</text>
  <text x="865" y="480" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="11">• POST /api/v1/auth/login</text>
  <text x="865" y="500" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="11">• GET /api/v1/mushak-6-3</text>
  <text x="865" y="520" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="11">• POST /api/v1/inventory/sync</text>
  <text x="865" y="540" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="11">• GET /api/v1/dashboard/metrics</text>

  <rect x="850" y="580" width="285" height="105" rx="10" fill="#DCFCE7" stroke="#10B981" stroke-opacity="0.5"/>
  <text x="865" y="605" fill="#15803D" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">✓ Production Certification</text>
  <text x="865" y="630" fill="#0F172A" font-family="system-ui, sans-serif" font-size="11">Server handles 1.84k req/sec peak with zero memory leaks, zero 500 errors, and average latency well below 200ms.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" fill="none">
  <defs>
    <linearGradient id="bgGrad4L" x1="0" y1="0" x2="1200" y2="750" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="curveGradL" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#10B981" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0.04"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" rx="20" fill="url(#bgGrad4L)" stroke="#CBD5E1" stroke-width="2"/>
  
  <!-- Header -->
  <rect x="30" y="30" width="1140" height="50" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
  <circle cx="60" cy="55" r="7" fill="#EF4444"/>
  <circle cx="85" cy="55" r="7" fill="#F59E0B"/>
  <circle cx="110" cy="55" r="7" fill="#10B981"/>
  <text x="145" y="60" fill="#0F172A" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600">JMeter &amp; k6 Performance Benchmark — SkySMS &amp; SkyVAT APIs</text>
  <rect x="990" y="42" width="160" height="26" rx="6" fill="#DBEAFE"/>
  <text x="1070" y="59" fill="#1D4ED8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="middle">500 VIRTUAL USERS</text>


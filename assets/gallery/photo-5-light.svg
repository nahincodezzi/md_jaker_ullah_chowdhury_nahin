  <text x="80" y="445" fill="#0F172A" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Automated Financial &amp; Business Rules Verification</text>

  <rect x="80" y="470" width="1040" height="80" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="105" y="500" fill="#059669" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">Standard 15% VAT Assertion:</text>
  <text x="105" y="525" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="12">assert item.vat_amount == round(item.taxable_value * Decimal('0.15'), 2)</text>
  <text x="750" y="515" fill="#15803D" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">✓ Tested over 2,400 orders</text>

  <rect x="80" y="565" width="1040" height="125" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="105" y="595" fill="#0284C7" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">Multi-tenant Data Isolation Rule:</text>
  <text x="105" y="620" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="12">SELECT * FROM invoices WHERE company_id = 10 AND branch_id = 2;</text>
  <text x="105" y="645" fill="#475569" font-family="system-ui, sans-serif" font-size="12">Enforces zero cross-branch data bleeding. Confirmed via Pytest and SQL queries that user from Branch A cannot view or edit Branch B records.</text>
  <text x="105" y="670" fill="#15803D" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">✓ Verified across 5 branch instances in production staging</text>

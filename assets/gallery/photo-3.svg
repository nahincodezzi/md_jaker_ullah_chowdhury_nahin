  <rect x="1035" y="14" width="140" height="24" rx="12" fill="rgba(16,185,129,0.15)" stroke="#10B981" stroke-width="1"/>
  <text x="1105" y="30" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">ZERO SEV-1 BUGS</text>

  <!-- 4 Triage Stages -->
  <!-- Stage 1 -->
  <rect x="40" y="70" width="260" height="245" rx="14" fill="#0E1726" stroke="#F43F5E" stroke-opacity="0.4"/>
  <rect x="60" y="90" width="85" height="26" rx="6" fill="rgba(244,63,94,0.15)"/>
  <text x="102" y="107" fill="#F43F5E" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">STAGE 01</text>
  <text x="60" y="145" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Discovery &amp; Log</text>
  <text x="60" y="175" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">• Exact reproduction steps</text>
  <text x="60" y="200" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">• Browser, OS &amp; DB context</text>
  <text x="60" y="225" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">• Network HAR &amp; server logs</text>
  <rect x="60" y="260" width="220" height="34" rx="8" fill="#16233B"/>
  <text x="75" y="282" fill="#F43F5E" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Priority: Blocker / Major</text>

  <!-- Stage 2 -->
  <rect x="325" y="70" width="260" height="245" rx="14" fill="#0E1726" stroke="#F59E0B" stroke-opacity="0.4"/>
  <rect x="345" y="90" width="85" height="26" rx="6" fill="rgba(245,158,11,0.15)"/>
  <text x="387" y="107" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">STAGE 02</text>
  <text x="345" y="145" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Triage &amp; Assign</text>
  <text x="345" y="175" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">• Root cause hypothesis</text>
  <text x="345" y="200" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">• Module classification</text>
  <text x="345" y="225" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">• Dev branch assignment</text>
  <rect x="345" y="260" width="220" height="34" rx="8" fill="#16233B"/>
  <text x="360" y="282" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Status: In Progress</text>

  <!-- Stage 3 -->
  <rect x="610" y="70" width="260" height="245" rx="14" fill="#0E1726" stroke="#38BDF8" stroke-opacity="0.4"/>
  <rect x="630" y="90" width="85" height="26" rx="6" fill="rgba(56,189,248,0.15)"/>
  <text x="672" y="107" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">STAGE 03</text>
  <text x="630" y="145" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Verification Run</text>
  <text x="630" y="175" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">• Staging deployment retest</text>
  <text x="630" y="200" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">• Boundary &amp; edge checks</text>
  <text x="630" y="225" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">• Side-effect regression test</text>
  <rect x="630" y="260" width="220" height="34" rx="8" fill="#16233B"/>
  <text x="645" y="282" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Automated + Manual</text>

  <!-- Stage 4 -->
  <rect x="895" y="70" width="265" height="245" rx="14" fill="#0E1726" stroke="#10B981" stroke-opacity="0.4"/>
  <rect x="915" y="90" width="85" height="26" rx="6" fill="rgba(16,185,129,0.15)"/>
  <text x="957" y="107" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">STAGE 04</text>
  <text x="915" y="145" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Closed &amp; Certified</text>
  <text x="915" y="175" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">• Pytest regression added</text>
  <text x="915" y="200" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">• 100% test suite verified</text>
  <text x="915" y="225" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">• Release notes certified</text>
  <rect x="915" y="260" width="225" height="34" rx="8" fill="#16233B"/>
  <text x="930" y="282" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Status: VERIFIED CLOSED</text>

  <!-- Lower Section: Real-World QA Bug Report Template (Width 1120, Cleanly wrapped lines) -->
  <rect x="40" y="335" width="1120" height="385" rx="14" fill="#0E1726" stroke="#1E2D4A"/>
  <rect x="40" y="335" width="1120" height="42" rx="14" fill="#16233B"/>
  <text x="65" y="361" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">REAL-WORLD BUG REPORT ARCHITECTURE (CODEZZI PRODUCTION SAMPLE)</text>

  <!-- Title Line -->
  <text x="65" y="405" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">DEFECT: [SkyVAT] [Mushak 6.3] Rounding discrepancy on fractional line item quantities</text>
  
  <!-- Environment Context Bar -->
  <rect x="65" y="420" width="1070" height="32" rx="6" fill="#16233B"/>
  <text x="80" y="441" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="11">Staging Build v2.8.4  |  Chrome 129 / Firefox 131  |  Database: PostgreSQL 15  |  Module: VAT Register</text>

  <!-- Steps to Reproduce -->
  <text x="65" y="480" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Steps to Reproduce:</text>
  <text x="65" y="505" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="12">1. Open Sales Invoice &gt; New Order &gt; Add Raw Materials with quantity 12.375 units</text>
  <text x="65" y="528" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="12">2. Apply 15% standard Mushak VAT rate and click 'Generate Tax Invoice'</text>
  <text x="65" y="551" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="12">3. Compare PDF invoice tax value against Database sales_ledger table record</text>

  <!-- Actual Result Box (Rose Tinted, Wrapped) -->
  <rect x="65" y="575" width="1070" height="48" rx="8" fill="rgba(244,63,94,0.15)" stroke="#F43F5E" stroke-opacity="0.3"/>
  <text x="80" y="595" fill="#F43F5E" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">ACTUAL RESULT:</text>
  <text x="195" y="595" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12">UI display truncates decimal to 2 places before multiplication causing a 0.04 BDT tax ledger variance.</text>
  <text x="80" y="612" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Root Cause: Frontend JS parseFloat().toFixed(2) called prematurely before passing to backend.</text>

  <!-- Expected Result Box (Emerald Tinted, Wrapped) -->
  <rect x="65" y="632" width="1070" height="48" rx="8" fill="rgba(16,185,129,0.15)" stroke="#10B981" stroke-opacity="0.3"/>
  <text x="80" y="652" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">EXPECTED RESULT:</text>
  <text x="205" y="652" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12">System must preserve 4 decimal float precision until final total round-off per NBR regulatory guidelines.</text>
  <text x="80" y="669" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Resolution: Backend handles exact arithmetic; automated pytest regression suite test_mushak_rounding added.</text>

  <!-- Footer Tag -->
  <text x="65" y="705" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">Logged by Md Jaker Ullah Chowdhury Nahin · Retested &amp; Certified in Sprint 18 Release</text>
</svg>
  <!-- Canvas Background -->
  <rect width="1200" height="750" rx="16" fill="url(#bgP3_dark)"/>
  <rect x="1" y="1" width="1198" height="748" rx="15" stroke="#1E2D4A" stroke-width="1.5"/>

  <!-- Top Header -->
  <rect x="1" y="1" width="1198" height="48" rx="15" fill="#0B1220"/>
  <line x1="1" y1="49" x2="1199" y2="49" stroke="#1E2D4A" stroke-width="1"/>
  <circle cx="28" cy="25" r="6" fill="#EF4444"/>
